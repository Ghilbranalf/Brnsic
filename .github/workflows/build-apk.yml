name: Build Brnsic Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK and Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ./android/local.properties
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Clean Nested APK Assets Before Sync
        run: |
          rm -f public/Brnsic.apk
          rm -f android/app/src/main/assets/public/Brnsic.apk

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || ./node_modules/.bin/cap sync android || true
          rm -f android/app/src/main/assets/public/Brnsic.apk || true

      - name: Make Gradle Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Brnsic.apk
          echo "APK successfully built: output/Brnsic.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brnsic-Android-APK
          path: output/Brnsic.apk
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "Brnsic Android App Release (v1.0)"
          body: |
            ### Brnsic Music Android Native APK
            Unduh dan pasang aplikasi resmi Brnsic untuk HP Android Anda.
            
            **Fitur Versi Native APK:**
            - Musik tetap berputar saat layar HP dimatikan atau membuka aplikasi lain.
            - Kontrol musik (Play/Pause/Next) muncul di Lock Screen & status bar Android.
            - Pengecualian optimasi baterai (Ignore Battery Optimization) untuk performa latar belakang tanpa gangguan.
            - Sinkronisasi otomatis ke website & database Supabase.
          files: output/Brnsic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
